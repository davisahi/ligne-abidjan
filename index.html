function brancher(){
  const $ = id => document.getElementById(id);
  habillerSelects();
  habillerHeures();

  if(document.getElementById('n-stops')){
    if(brouillonStops === null){
      const src = editId ? db.routes.find(t=>t.id===editId && t.owner===me) : null;
      brouillonStops = src ? src.arrets.map(a=>({...litArret(a)})) : [];
    }
    rendreStops();
  } else brouillonStops = null;

  $('n-addstop') && ($('n-addstop').onclick = ()=>{
    brouillonStops.push({nom:'', heure:''});
    rendreStops();
    document.querySelector('#n-stops .stoprow:last-child .stopnom')?.focus();
  });

  /* placer précisément le départ et l'arrivée */
  document.querySelectorAll('[data-pinterm]').forEach(b=>b.onclick = ()=>{
    const quoi = b.dataset.pinterm;
    const nom = document.getElementById(quoi==='dep'?'n-de':'n-vers').value;
    const dep = quoi==='dep' ? termDep : termArr;
    ouvrirPointeur('Placer « '+nom+' »', dep, pos=>{
      if(quoi==='dep') termDep = pos; else termArr = pos;
      b.textContent = '✓ placé'; b.classList.add('ok');
      toast('Point placé');
    });
  });

  $('f-de')   && ($('f-de').onchange   = e=>{filtre.de=e.target.value; render();});
  $('f-vers') && ($('f-vers').onchange = e=>{filtre.vers=e.target.value; render();});
  $('f-libre')&& ($('f-libre').onchange= e=>{filtre.libre=e.target.checked; render();});
  $('f-swap') && ($('f-swap').onclick  = ()=>{[filtre.de,filtre.vers]=[filtre.vers,filtre.de]; render();});

  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
    authTab = b.dataset.tab; authErr=''; render();
  });

  $('a-go') && ($('a-go').onclick = ()=>{
    const tel = $('a-tel').value.replace(/\D/g,'');
    const mdp = $('a-mdp').value;
    const u = db.users.find(x=>x.tel===tel && x.statut!=='admin');
    if(!u || u.mdp!==mdp){ authErr='Numéro ou mot de passe incorrect.'; return render(); }
    me=u.id; authErr=''; render(); toast('Bonjour '+u.nom.split(' ')[0]);
  });

  $('s-go') && ($('s-go').onclick = ()=>{
    const nom = $('s-nom').value.trim();
    const tel = $('s-tel').value.replace(/\D/g,'');
    const mail = $('s-mail').value.trim();
    const mdp = $('s-mdp').value, mdp2 = $('s-mdp2').value;
    if(nom.length<3)      authErr='Indiquez votre nom et vos prénoms.';
    else if(tel.length<10) authErr='Le numéro doit contenir 10 chiffres.';
    else if(db.users.some(u=>u.tel===tel)) authErr='Ce numéro a déjà un compte.';
    else if(mail && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) authErr="Cette adresse e-mail n'est pas valide.";
    else if(mdp.length<6)  authErr='Le mot de passe doit faire 6 caractères minimum.';
    else if(mdp!==mdp2)    authErr='Les deux mots de passe ne sont pas identiques.';
    else authErr='';
    if(authErr) return render();
    const id = 'u'+Date.now();
    db.users.push({id, nom, tel, mail, mdp, statut:'en attente'});
    me=id; save(); render(); toast('Compte créé — en attente de validation');
  });

  $('logout') && ($('logout').onclick = ()=>{
    me=null; editId=null; prefill=null; authTab='connexion'; render(); toast('Déconnecté');
  });

  $('ad-go') && ($('ad-go').onclick = ()=>{
    const tel = $('ad-tel').value.replace(/\D/g,'');
    const mdp = $('ad-mdp').value;
    const a = db.users.find(x=>x.statut==='admin' && x.tel===tel && x.mdp===mdp);
    if(!a){ adminErr='Identifiant ou mot de passe incorrect.'; return render(); }
    adminOk=true; adminErr=''; render(); toast('Session administrateur ouverte');
  });

  $('adlogout') && ($('adlogout').onclick = ()=>{
    adminOk=false; render(); toast('Session fermée');
  });

  document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{
    user(b.dataset.ok).statut='actif';
    notifierId = b.dataset.ok;
    save(); render(); toast('Compte validé — prévenez le propriétaire');
  });

  document.querySelectorAll('[data-prev]').forEach(b=>b.onclick=()=>{
    notifierId = b.dataset.prev; render();
  });

  $('msg-close') && ($('msg-close').onclick = ()=>{ notifierId=null; render(); });

  const envoyer = (canal)=>{
    const u = user(notifierId), texte = $('msg-txt').value;
    const url = canal==='wa'
      ? 'https://wa.me/225'+u.tel.replace(/\D/g,'')+'?text='+encodeURIComponent(texte)
      : 'mailto:'+u.mail+'?subject='+encodeURIComponent('Votre compte Ligne Abidjan est validé')
        +'&body='+encodeURIComponent(texte);
    window.open(url, '_blank', 'noopener');
    u.prevenuLe = Date.now();
    notifierId = null; save(); render(); toast('Message ouvert — reste à l\'envoyer');
  };
  $('msg-wa')   && ($('msg-wa').onclick   = ()=>envoyer('wa'));
  $('msg-mail') && ($('msg-mail').onclick = ()=>envoyer('mail'));

  $('f-q') && ($('f-q').oninput = e=>{
    filtre.q = e.target.value;
    const pos = e.target.selectionStart; render();
    const n = document.getElementById('f-q');
    if(n){ n.focus(); n.setSelectionRange(pos,pos); }
  });
  /* une ligne populaire ouvre son trajet et le déplie */
  /* la barre compacte n'apparaît qu'après le formulaire, et seulement côté voyageur */
  const mb = document.getElementById('minibar');
  if(observateur){ observateur.disconnect(); observateur = null; }
  const cible = document.querySelector('.search.bloc');
  if(role === 'visiteur' && cible && 'IntersectionObserver' in window){
    document.getElementById('minibar-txt').textContent =
      (filtre.de || 'Toutes communes') + '  →  ' + (filtre.vers || 'Toutes communes')
      + (filtre.q ? ' · ' + filtre.q : '');
    observateur = new IntersectionObserver(([e])=>{
      mb.hidden = e.isIntersecting;
    }, {rootMargin:'-72px 0px 0px 0px'});
    observateur.observe(cible);
  } else {
    mb.hidden = true;
  }

  $('f-go') && ($('f-go').onclick = ()=>{
    document.querySelector('.count')?.scrollIntoView({behavior:'smooth', block:'start'});
  });

  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
    const t = db.routes.find(x=>x.id===b.dataset.go);
    if(!t) return;
    filtre = {q:'', de:t.depart, vers:t.arrivee, libre:false, tri:filtre.tri};
    ouverts.add(t.id);
    render();
    document.querySelector('.card')?.scrollIntoView({behavior:'smooth', block:'start'});
  });

  document.querySelectorAll('[data-onglet]').forEach(b=>b.onclick=()=>{
    const sens = ORDRE.indexOf(b.dataset.onglet) > ORDRE.indexOf(role) ? 1 : -1;
    role = b.dataset.onglet;
    render(sens);
    scrollTo({top:0, behavior:'smooth'});
  });

  document.querySelectorAll('[data-tri]').forEach(b=>b.onclick=()=>{
    filtre.tri = b.dataset.tri; render();
  });

  document.querySelectorAll('[data-share]').forEach(b=>b.onclick=async ()=>{
    const t = db.routes.find(x=>x.id===b.dataset.share);
    const txt = b.dataset.txt;
    const vueBouton = b.innerHTML;
    b.disabled = true; b.textContent = '…';
    try{
      const blob = await imageDeCarte(t);
      const img = new File([blob], 'ligne-'+cle(t.depart)+'-'+cle(t.arrivee)+'.png',
                           {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[img]})){
        await navigator.share({files:[img], text:txt});
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = img.name; a.click();
        setTimeout(()=>URL.revokeObjectURL(url), 4000);
        try{ await navigator.clipboard.writeText(txt); }catch(e){}
        toast('Image enregistrée — à joindre dans WhatsApp');
      }
    }catch(e){
      if(e && e.name === 'AbortError'){ /* partage annulé */ }
      else { window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank','noopener'); }
    }
    b.disabled = false; b.innerHTML = vueBouton;
  });

  document.querySelectorAll('[data-wait]').forEach(b=>b.onclick=()=>{
    const t = db.routes.find(x=>x.id===b.dataset.wait);
    ouvrirFormulaire({
      titre:"Liste d'attente",
      sous:t.depart+' → '+t.arrivee+". Le propriétaire vous appellera dès qu'une place se libère.",
      action:"M'inscrire",
      champs:[
        {id:'nom', label:'Nom et prénoms', exemple:'Konan Brou'},
        {id:'tel', label:'Votre numéro', exemple:'07 07 07 07 07', type:'tel', mode:'numeric'}
      ],
      verifier:v=>
        v.nom.length < 3  ? 'Indiquez votre nom et vos prénoms.' :
        !telValide(v.tel) ? 'Le numéro doit contenir 10 chiffres.' : '',
      valider:v=>{
        t.attente = t.attente || [];
        t.attente.push({nom:v.nom, tel:v.tel, le:Date.now()});
        save(); render();
        toast('Inscrit — vous êtes '+t.attente.length+(t.attente.length>1?'e':'er')+' sur la liste');
      }
    });
  });

  document.querySelectorAll('[data-unwait]').forEach(b=>b.onclick=()=>{
    const [id,i] = b.dataset.unwait.split('|');
    db.routes.find(x=>x.id===id).attente.splice(+i,1);
    save(); render(); toast('Retiré de la liste');
  });

  document.querySelectorAll('[data-photo]').forEach(inp=>inp.onchange = async e=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const t = db.routes.find(x=>x.id===inp.dataset.photo && x.owner===me);
    if(!t) return;
    toast('Traitement de la photo…');
    try{
      t.chauffeurPhoto = await compresserPhoto(file);
      save(); render(); toast('Photo du chauffeur enregistrée');
    }catch(err){ toast(err.message || 'Photo non prise en charge'); }
  });
  document.querySelectorAll('#n-swat .sw').forEach(b=>b.onclick = ()=>{
    const dejaChoisi = b.getAttribute('aria-pressed') === 'true';
    const col = dejaChoisi ? '' : b.dataset.col;
    document.querySelectorAll('#n-swat .sw').forEach(x=>
      x.setAttribute('aria-pressed', x.dataset.col === col));
    $('n-couleur').value = col;
    $('n-swname').innerHTML = col
      ? 'Sélection : <b>'+esc(col)+'</b>' : 'Aucune couleur choisie';
  });

  document.querySelectorAll('[data-photodel]').forEach(b=>b.onclick = ()=>{
    const t = db.routes.find(x=>x.id===b.dataset.photodel && x.owner===me);
    if(t){ delete t.chauffeurPhoto; save(); render(); toast('Photo retirée'); }
  });

  document.querySelectorAll('[data-int]').forEach(b=>b.onclick=()=>{
    db.interets = db.interets || [];
    db.interets.push({ligne:b.dataset.int, owner:me, le:Date.now()});
    save(); render(); toast("Intérêt signalé — l'administrateur vous contactera");
  });

  document.querySelectorAll('[data-creer]').forEach(b=>b.onclick=()=>{
    const g = demandesGroupees().find(x=>x.ligne===b.dataset.creer);
    if(!g) return;
    prefill = {de:g.de, vers:g.vers, n:g.gens.length};
    editId = null; render();
    document.getElementById('n-de')?.closest('.panel')
      ?.scrollIntoView({behavior:'smooth', block:'start'});
  });

  document.querySelectorAll('[data-pause]').forEach(b=>b.onclick=()=>{
    const t = db.routes.find(x=>x.id===b.dataset.pause);
    t.actif = t.actif===false; t.maj = Date.now(); save(); render();
    toast(t.actif? 'Trajet remis en service' : 'Trajet masqué aux voyageurs');
  });

  document.querySelectorAll('[data-verif]').forEach(b=>b.onclick=()=>{
    const t = db.routes.find(x=>x.id===b.dataset.verif);
    t.verifie = !t.verifie; save(); render();
    toast(t.verifie? 'Véhicule marqué vérifié' : 'Badge retiré');
  });

  document.querySelectorAll('[data-demrm]').forEach(b=>b.onclick=()=>{
    const [de,vers] = b.dataset.demrm.split(' → ');
    db.demandes = db.demandes.filter(d=>!(d.de===de && d.vers===vers));
    db.interets = (db.interets||[]).filter(i=>i.ligne!==b.dataset.demrm);
    save(); render(); toast('Demande archivée');
  });

  document.querySelectorAll('#dem-open, [id="dem-open"]').forEach(b=>b.onclick = ()=>{
    ouvrirFormulaire({
      titre:'Demander une ligne',
      sous:"Nous regroupons les demandes par trajet. Les lignes les plus réclamées sont proposées en priorité aux propriétaires de car.",
      action:'Envoyer la demande',
      champs:[
        {id:'de',   label:'Je pars de',  exemple:'Anyama',   valeur:filtre.de},
        {id:'vers', label:'Je vais à',   exemple:'Plateau',  valeur:filtre.vers},
        {id:'tel',  label:'Votre numéro', exemple:'07 07 07 07 07', type:'tel', mode:'numeric'}
      ],
      verifier:v=>
        v.de.length < 3   ? 'Indiquez votre commune ou quartier de départ.' :
        v.vers.length < 3 ? "Indiquez où vous allez." :
        !telValide(v.tel) ? 'Le numéro doit contenir 10 chiffres.' : '',
      valider:v=>{
        db.demandes = db.demandes || [];
        db.demandes.push({id:'d'+Date.now(), de:v.de, vers:v.vers, tel:v.tel, le:Date.now()});
        save(); render(); toast('Demande enregistrée — merci');
      }
    });
  });

  document.querySelectorAll('[data-stops]').forEach(b=>b.onclick=()=>{
    const id = b.dataset.stops;
    ouverts.has(id)? ouverts.delete(id) : ouverts.add(id);
    render();
  });

  document.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{
    const t = db.routes.find(x=>x.id===b.dataset.inc);
    if(t.pris>=t.places) return toast('Le car est déjà complet');
    t.pris++; t.maj=Date.now(); save(); render();
  });
  document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{
    const t = db.routes.find(x=>x.id===b.dataset.dec);
    if(t.pris<=0) return;
    t.pris--; t.maj=Date.now(); save(); render();
  });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(editId === b.dataset.del) editId = null;
    db.routes = db.routes.filter(x=>x.id!==b.dataset.del);
    save(); render(); toast('Trajet retiré');
  });
  document.querySelectorAll('[data-sus]').forEach(b=>b.onclick=()=>{
    const u = user(b.dataset.sus);
    u.statut = u.statut==='actif'?'suspendu':'actif';
    save(); render(); toast(u.statut==='actif'?'Compte réactivé':'Compte suspendu');
  });
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{
    db.users  = db.users.filter(u=>u.id!==b.dataset.rm);
    db.routes = db.routes.filter(t=>t.owner!==b.dataset.rm);
    save(); render(); toast('Compte supprimé');
  });

  if($('n-off')){
    const majOff = ()=>{
      const sel = $('n-off'), garde = sel.value;
      const milieu = joursEntre($('n-debut').value, $('n-fin').value).slice(1,-1);
      sel.innerHTML = '<option value="">Aucun</option>'
        + milieu.map(d=>`<option>${d}</option>`).join('');
      if(milieu.includes(garde)) sel.value = garde;
      sel.disabled = milieu.length === 0;
    };
    $('n-debut').onchange = majOff;
    $('n-fin').onchange = majOff;
    majOff();
  }

  $('n-save') && ($('n-save').onclick = ()=>{
    const v = id => $(id).value.trim();
    const plaque = v('n-plaque').toUpperCase();
    if(v('n-de')===v('n-vers')) return toast('Départ et arrivée identiques');
    if(plaque.length<4) return toast("Indiquez la plaque d'immatriculation");
    const places = Math.max(1,+v('n-places')||1);
    const champs = {
      plaque,
      depart:v('n-de'), arrivee:v('n-vers'),
      arrets: (brouillonStops||[]).filter(a=>(a.nom||'').trim())
        .map(a=>({nom:a.nom.trim(), heure:/^\d{1,2}:\d{2}$/.test(a.heure||'')?a.heure:'',
                  ...(Number.isFinite(a.lat)?{lat:a.lat,lng:a.lng}:{})})),
      departPos: termDep || (LIEUX[cle(v('n-de'))]
        ? {lat:LIEUX[cle(v('n-de'))][0], lng:LIEUX[cle(v('n-de'))][1]} : null),
      arriveePos: termArr || (LIEUX[cle(v('n-vers'))]
        ? {lat:LIEUX[cle(v('n-vers'))][0], lng:LIEUX[cle(v('n-vers'))][1]} : null),
      aller:v('n-aller')||'—', retour:v('n-retour')||'—',
      jdebut:v('n-debut'), jfin:v('n-fin'), joff:v('n-off'),
      clim: $('n-clim').checked,
      chauffeur: v('n-chauf'),
      couleur: $('n-couleur').value,
      prix:Math.max(0,+v('n-prix')||0),
      places, maj:Date.now()
    };
    if(editId){
      const t = db.routes.find(x=>x.id===editId && x.owner===me);
      Object.assign(t, champs);
      if(t.pris > places){
        t.pris = places;
        toast('Abonnés ramenés à '+places+', le nombre de places a baissé');
      } else toast('Trajet mis à jour');
      editId = null;
    } else {
      prefill = null;
      db.routes.push(Object.assign({id:'t'+Date.now(), owner:me, actif:true,
        verifie:false, attente:[],
        pris:Math.min(places, Math.max(0,+v('n-pris')||0))}, champs));
      toast('Trajet enregistré');
    }
    brouillonStops = null; termDep = termArr = null;
    save(); render();
  });

  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{
    editId = b.dataset.edit; brouillonStops = null; termDep = termArr = null; render();
    document.getElementById('n-de')?.closest('.panel')
      ?.scrollIntoView({behavior:'smooth', block:'start'});
  });

  $('n-cancel') && ($('n-cancel').onclick = ()=>{ editId = null; prefill = null; brouillonStops = null; termDep = termArr = null; render(); });

  $('reset') && ($('reset').onclick = ()=>{ db=seed(); save(); render(); toast('Données réinitialisées'); });
}

document.querySelectorAll('[data-tb]').forEach(b=>b.onclick=()=>{
  const cible = b.dataset.tb;
  if(cible === role){ scrollTo({top:0, behavior:'smooth'}); return; }
  const sens = ORDRE.indexOf(cible) > ORDRE.indexOf(role) ? 1 : -1;
  role = cible;
  render(sens);
  scrollTo({top:0, behavior:'smooth'});
});

document.getElementById('minibar-go').onclick = ()=>{
  document.getElementById('ancre-recherche')
    ?.scrollIntoView({behavior:'smooth', block:'start'});
};

document.querySelectorAll('.rolebtn').forEach(b=>b.onclick=()=>{
  if(b.dataset.role === role) return;
  const sens = ORDRE.indexOf(b.dataset.role) > ORDRE.indexOf(role) ? 1 : -1;
  role = b.dataset.role;
  render(sens);
});
addEventListener('resize', ()=>placerGlide(false));
load().then(render);

if('serviceWorker' in navigator && location.protocol === 'https:'){
  addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
