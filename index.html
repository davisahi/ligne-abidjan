<meta charset="utf-8">
<title>Ligne Abidjan — abonnements car dans le Grand Abidjan</title>
<meta name="description" content="Trouvez un car en abonnement mensuel pour votre trajet domicile-travail à Abidjan : horaires, arrêts, tarif et places disponibles. Contact direct avec le propriétaire.">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-192.png">

<meta property="og:type" content="website">
<meta property="og:title" content="Ligne Abidjan — abonnements car">
<meta property="og:description" content="Les lignes de car en abonnement mensuel du Grand Abidjan : horaires, arrêts, tarif, places libres.">
<meta property="og:image" content="apercu.png">
<meta property="og:locale" content="fr_CI">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#F1F1F1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ligne Abidjan — abonnements car</title>

<style>
  :root{
    --blue:#0381FE; --purple:#7B5CFA; --orange:#FF6B00;
    --green:#3ACC5C; --pink:#FF4E8B; --red:#FF3B30;
    --bg:#F1F1F1;
    --card:#FFFFFF;
    --ink:#0A0A0A;
    --ink2:#69696E;
    --ink3:#A0A0A5;
    --sep:#EAEAEA;
    --verif:#2FBF5B;      /* couleur du macaron « vérifié » */
    --fill:#F4F4F5;
    --r:28px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{
    background:var(--bg);color:var(--ink);min-height:100vh;
    font:400 17px/1.45 'One UI Sans',-apple-system,BlinkMacSystemFont,'Samsung Sans',
         Roboto,'Segoe UI',system-ui,sans-serif;
    letter-spacing:-.005em;-webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .bg{display:none}
  .wrap{width:100%;max-width:660px;margin:0 auto;padding:0 14px 128px}

  /* la liste des trajets se répartit d'elle-même selon la largeur */
  .cards{display:grid;gap:14px;grid-template-columns:1fr}
  .card{margin:0}
  button{font:inherit;letter-spacing:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font:inherit;letter-spacing:inherit;width:100%}
  :focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:10px}

  /* ---------- barre supérieure ---------- */
  .topbar{
    position:sticky;top:0;z-index:8;background:var(--card);
    border-bottom:1px solid var(--sep);
  }
  .tb-in{
    display:flex;align-items:center;gap:14px;
    max-width:660px;margin:0 auto;padding:11px 16px;
  }
  .tb-logo{display:flex;align-items:center;gap:9px;flex:none;padding:0}
  .tb-logo svg{width:30px;height:30px;flex:none}
  .tb-logo span{font-size:17.5px;font-weight:500;letter-spacing:-.02em;white-space:nowrap}
  .tb-logo b{font-weight:800}

  .tb-nav{display:none;gap:4px;margin:0 auto}
  .tb-nav button{
    padding:9px 14px;border-radius:99px;font-size:15px;font-weight:600;color:var(--ink2);
  }
  .tb-nav button[aria-current="true"]{color:var(--blue);background:#EAF3FF}

  .tb-act{display:flex;align-items:center;gap:9px;margin-left:auto;flex:none}
  .tb-pub{
    display:none;padding:10px 18px;border-radius:99px;border:1.6px solid var(--blue);
    color:var(--blue);font-size:14.5px;font-weight:700;white-space:nowrap;
  }
  .tb-pub:active{background:#EAF3FF}
  .tb-user{
    width:38px;height:38px;border-radius:50%;background:#EAF3FF;color:var(--blue);
    display:grid;place-items:center;flex:none;
  }
  .tb-user svg{width:22px;height:22px}
  .tb-user[aria-current="true"]{background:var(--blue);color:#fff}

  /* sur écran large : navigation en haut, barre du bas retirée */
  @media (min-width:680px){
    .tb-in{max-width:900px;padding:13px 22px;gap:20px}
    .tb-nav{display:flex}
    .tb-pub{display:block}
    .rolebar{display:none}
    .wrap{padding-bottom:56px}
  }
  @media (min-width:1100px){ .tb-in{max-width:1180px;padding:15px 32px} }
  @media (min-width:1500px){ .tb-in{max-width:1440px} }

  /* ---------- barre du bas, capsule flottante ---------- */
  .rolebar{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(12px + env(safe-area-inset-bottom));z-index:6;
    width:calc(100% - 28px);max-width:420px;
    background:rgba(255,255,255,.94);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    border-radius:34px;padding:6px;border:none;
    box-shadow:0 6px 26px rgba(0,0,0,.13),0 1px 3px rgba(0,0,0,.07);
  }
  .rolebar-in{margin:0;display:flex;gap:0;position:relative}
  .rolebar b{display:none}
  /* pastille qui n'entoure que l'icône, le libellé reste dessous */
  .glide{
    position:absolute;top:7px;left:0;width:64px;height:34px;
    border-radius:17px;pointer-events:none;background:#E4EFFF;
    border:none;box-shadow:none;
    transition:transform .5s cubic-bezier(.33,1.22,.44,1),
               width .5s cubic-bezier(.33,1.22,.44,1);
  }
  .rolebtn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;
    padding:9px 4px 8px;font-size:11.5px;font-weight:500;color:var(--ink2);
    letter-spacing:0;position:relative;z-index:1;
    transition:color .3s ease;
  }
  .rolebtn svg{
    width:24px;height:24px;stroke-width:1.9;margin-top:3px;
    transition:transform .4s cubic-bezier(.33,1.22,.44,1),stroke-width .3s ease;
  }
  .rolebtn[aria-pressed="true"]{color:var(--ink);font-weight:700}
  .rolebtn[aria-pressed="true"] svg{color:var(--blue);stroke-width:2.2}

  /* ---------- cartes blanches ---------- */
  .search,.panel,.card,.stat,.empty,.banner{
    background:var(--card);border:none;border-radius:var(--r);
    box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  .search,.panel{padding:20px;margin:14px 0}

  /* formulaire empilé, à la manière de BlaBlaCar */
  .search.bloc{padding:0;overflow:hidden}
  .srow{
    display:flex;align-items:center;gap:12px;
    padding:14px 18px;border-bottom:1px solid var(--sep);
  }
  .srow label{
    flex:0 0 62px;margin:0;font-size:13px;font-weight:600;color:var(--ink2);
  }
  .srow .selwrap{flex:1;min-width:0}
  .srow .seltrig,.srow input{background:transparent;padding:0;border-radius:0;font-size:16.5px}
  .srow input::placeholder{color:var(--ink3)}
  .srow .swap{
    width:38px;height:38px;flex:none;align-self:center;font-size:16px;
    background:var(--fill);color:var(--blue);box-shadow:none;
  }
  .srow-t{padding:14px 18px}
  .srow-t label{flex:1}
  .sgo{
    width:100%;background:var(--blue);color:#fff;padding:17px;
    font-size:17px;font-weight:700;border-radius:0;
  }
  .sgo:active{background:#0269D0}

  /* barre compacte qui suit le défilement */
  .minibar{
    position:sticky;top:60px;z-index:7;background:var(--bg);
    padding:8px 14px 10px;border-bottom:1px solid var(--sep);
  }
  .minibar-in{
    display:flex;align-items:center;gap:11px;width:100%;max-width:660px;margin:0 auto;
    background:var(--card);border:1.5px solid var(--blue);border-radius:99px;
    padding:6px 6px 6px 16px;text-align:left;
  }
  .minibar-in svg{width:19px;height:19px;flex:none;color:var(--ink2)}
  .minibar-in span{
    flex:1;min-width:0;font-size:14px;color:var(--ink);line-height:1.25;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .minibar-in b{
    flex:none;background:var(--blue);color:#fff;border-radius:99px;
    padding:11px 18px;font-size:14.5px;font-weight:700;
  }
  @media (min-width:680px){ .minibar{padding:10px 22px 12px} }

  /* illustrations */
  .illu-hero{
    display:block;width:100%;height:auto;border-radius:26px;margin-bottom:18px;
    background:#EDF3FA;
  }
  .illu-cta{display:block;width:100%;height:auto;border-radius:20px;margin-bottom:18px}
  .piliers div > svg{width:48px;height:48px;grid-row:span 2;flex:none}

  /* accroche */
  .hero{padding:8px 6px 4px}
  .hero h1{
    font-size:clamp(24px,6.4vw,30px);font-weight:700;letter-spacing:-.025em;
    line-height:1.2;margin-bottom:8px;
  }
  .hero p{font-size:15px;color:var(--ink2);line-height:1.5;max-width:560px}
  .hero b{color:var(--ink)}

  /* lignes populaires */
  .vedettes{margin:20px 0 4px}
  .vedettes h3{font-size:17px;font-weight:700;padding:0 6px 10px;letter-spacing:-.015em}
  .vrail{
    display:flex;gap:10px;overflow-x:auto;padding:2px 6px 8px;
    scroll-snap-type:x mandatory;scrollbar-width:none;
  }
  .vrail::-webkit-scrollbar{display:none}
  .vcard{
    flex:none;width:214px;text-align:left;background:var(--card);border-radius:22px;
    padding:17px 18px;scroll-snap-align:start;box-shadow:0 1px 2px rgba(0,0,0,.05);
    display:flex;flex-direction:column;gap:12px;
  }
  .vcard:active{background:#F7F7F8}
  .vline{display:flex;flex-direction:column;gap:14px;position:relative}
  .vline::before{
    content:'';position:absolute;left:5.5px;top:11px;bottom:11px;width:2px;background:var(--ink);
  }
  .vpt{display:flex;align-items:center;gap:11px;font-size:15px;font-weight:700;line-height:1.2}
  .vpt i{
    width:13px;height:13px;flex:none;border-radius:50%;border:2.5px solid var(--ink);
    background:var(--card);z-index:1;
  }
  .vbas{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  .vbas em{display:block;font-style:normal;font-size:11.5px;color:var(--ink2);font-weight:500}
  .vbas b{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
  .vbas em:last-child{display:inline;font-size:11px}
  .vfleche{
    width:38px;height:38px;flex:none;border-radius:50%;background:var(--blue);color:#fff;
    display:grid;place-items:center;font-size:17px;
  }
  .vplaces{font-size:12.5px;color:#1E9C41;font-weight:600}

  /* piliers de confiance */
  .piliers{background:var(--card);border-radius:var(--r);margin:24px 0 4px;padding:4px 20px}
  .piliers div{
    display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:start;
    padding:20px 0;border-top:1px solid var(--sep);
  }
  .piliers div:first-child{border-top:none}
  .piliers svg{grid-row:span 2;margin:0}
  .piliers b{font-size:16.5px;font-weight:700}
  .piliers p{font-size:14px;color:var(--ink2);line-height:1.5}

  /* appel aux propriétaires */
  .proprio-cta{
    background:#0A0A0A;color:#fff;border-radius:var(--r);padding:24px 22px;margin:20px 0 4px;
  }
  .proprio-cta h3{font-size:21px;font-weight:700;letter-spacing:-.02em;margin-bottom:8px}
  .proprio-cta p{font-size:14.5px;line-height:1.55;color:rgba(255,255,255,.72);margin-bottom:16px}
  .proprio-cta b{color:#fff}
  .proprio-cta .save{background:#fff;color:#0A0A0A;margin:0}
  .proprio-cta .save:active{background:#E9E9EC}

  @media (min-width:680px){
    .piliers{grid-template-columns:repeat(3,1fr)}
    .hero{padding:14px 6px 6px}
  }
  .card{margin:14px 0;overflow:hidden}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .field{flex:1 1 140px;min-width:0}
  label{display:block;font-size:13px;color:var(--ink2);margin-bottom:7px;font-weight:500}
  input,select,textarea{
    background:var(--fill);border:none;border-radius:16px;
    padding:14px 15px;color:var(--ink);
  }
  input::placeholder{color:var(--ink3)}
  select{appearance:none;-webkit-appearance:none;padding-right:34px;
    background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%2369696E'%3E%3Cpath d='M4.5 6.5L8 10l3.5-3.5z'/%3E%3C/svg%3E");
    background-repeat:no-repeat;background-position:right 13px center}
  .swap{
    align-self:flex-end;width:50px;height:50px;border-radius:50%;flex:none;
    background:var(--blue);color:#fff;font-size:19px;
    box-shadow:0 2px 8px rgba(3,129,254,.32);
  }
  .toggle{
    display:flex;flex-direction:row-reverse;justify-content:space-between;
    align-items:center;margin-top:18px;font-size:16px;
  }
  .toggle input{
    appearance:none;-webkit-appearance:none;flex:none;width:52px;height:30px;
    border-radius:15px;background:#D5D5D8;position:relative;border:none;
    transition:background .24s ease;
  }
  .toggle input::after{
    content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;
    border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.24);
    transition:transform .24s ease;
  }
  .toggle input:checked{background:var(--blue)}
  .toggle input:checked::after{transform:translateX(22px)}
  .count{font-size:13px;color:var(--ink2);margin:20px 0 8px;padding-left:20px;font-weight:500}

  /* ---------- fiche trajet ---------- */
  .placard{padding:20px 20px 16px;border-bottom:1px solid var(--sep)}
  .ptop{display:flex;align-items:flex-start;gap:12px}
  .ptop h2{flex:1;min-width:0;font-size:clamp(19px,5vw,22px);font-weight:700;letter-spacing:-.02em;line-height:1.22}
  .placard .arrow{color:var(--blue);margin:0 5px;font-weight:500}
  .ptag{
    flex:none;text-align:right;background:#EAF3FF;border-radius:18px;
    padding:8px 13px 7px;border:none;
  }
  .ptag b{display:block;font-size:17px;font-weight:700;color:var(--blue);line-height:1.1}
  .ptag span{font-size:10.5px;color:#5B8FD0;font-weight:500}
  .ptimes{
    display:flex;gap:15px;align-items:center;margin-top:11px;
    font-size:14px;color:var(--ink2);flex-wrap:wrap;
  }
  .ptimes .pdur{margin-left:auto;font-size:13px;color:var(--ink3)}
  .body{padding:6px 20px 20px}

  /* puces */
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0 15px}
  .chip{
    font-size:12px;font-weight:600;padding:6px 12px;border-radius:99px;
    background:var(--fill);border:none;color:var(--ink2);
  }
  .chip.ok{background:#E7F8EB;color:#1E9C41}
  .chip.warn{background:#FFF2E5;color:#C25A00}

  /* jauge */
  .jauge{height:8px;border-radius:99px;background:#EDEDEF;overflow:hidden;margin-bottom:9px}
  .jauge i{
    display:block;height:100%;border-radius:99px;background:var(--green);
    transition:width .5s cubic-bezier(.33,1.15,.44,1);
  }
  .jauge i.plein{background:var(--orange)}
  .jline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .avail{font-size:15px;font-weight:700;color:#1E9C41}
  .avail.none{color:var(--red)}
  .jsub{font-size:12.5px;color:var(--ink3);margin-left:auto}
  .verif{
    width:1em;height:1em;color:var(--verif);flex:none;
    vertical-align:-.13em;margin-left:.3em;
  }
  .mini-t .verif{width:17px;height:17px;vertical-align:-3px}
  .full-flag{
    display:inline-block;background:#FFE9E7;color:#D3271B;font-size:12px;
    font-weight:700;padding:4px 11px;border-radius:99px;
  }
  .seats{display:none}
  .stamp{font-size:13px;color:var(--ink3);margin-top:5px}

  /* trajet dépliable */
  .stopsbtn{
    display:flex;align-items:center;gap:9px;width:100%;font-size:16px;font-weight:600;
    color:var(--blue);padding:14px 0;border-top:1px solid var(--sep);margin-bottom:14px;
  }
  .stopsbtn .chev{display:inline-block;font-size:11px;transition:transform .3s ease}
  .stopsbtn[aria-expanded="true"] .chev{transform:rotate(90deg)}
  .stopsbtn .n{margin-left:auto;font-size:14px;color:var(--ink3);font-weight:400}

  .itin{list-style:none;margin:0 0 16px;padding:2px 0 0 2px}
  .itin li{
    position:relative;padding:0 0 18px 30px;font-size:16px;
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  }
  .itin li:last-child{padding-bottom:0}
  .itin li b{flex:1;min-width:0;font-weight:600}
  .itin li u{
    text-decoration:none;font-size:14px;color:var(--blue);font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .itin li em{flex-basis:100%;order:3;font-style:normal;font-size:13px;color:var(--ink3);margin-top:2px}
  .itin li::before{
    content:'';position:absolute;left:3px;top:6px;width:10px;height:10px;
    border-radius:50%;background:#fff;border:2.5px solid #D2D2D6;
  }
  .itin li::after{content:'';position:absolute;left:7.5px;top:19px;bottom:0;width:2.5px;background:#E6E6E9}
  .itin li:last-child::after{display:none}
  .itin li.start::before{background:var(--blue);border-color:var(--blue)}
  .itin li.end::before{background:var(--orange);border-color:var(--orange)}

  .modeop{margin:0 0 16px;padding-left:20px;font-size:14px;color:var(--ink2);line-height:1.5}
  .modeop li{margin-bottom:7px}
  .modeop b{color:var(--ink)}
  .ptetat{font-size:13.5px;font-weight:600;margin-top:10px;line-height:1.4}
  .ptetat.oui{color:#1E9C41}
  .ptetat.ko{color:var(--red)}
  .ptetat.att{color:var(--ink2);display:flex;align-items:center;gap:9px}
  .lienouvre{color:var(--blue);font-weight:700}
  .spin{
    width:15px;height:15px;flex:none;border-radius:50%;
    border:2.5px solid #D8D8DC;border-top-color:var(--blue);
    animation:tourne .8s linear infinite;
  }
  @keyframes tourne{to{transform:rotate(360deg)}}
  .stoprow{
    display:grid;grid-template-columns:auto 1fr auto auto;gap:9px;align-items:center;
    padding:10px 0;border-top:1px solid var(--sep);
  }
  .stoprow:first-child{border-top:none}
  .stopnum{
    width:26px;height:26px;border-radius:50%;background:var(--fill);color:var(--ink2);
    display:grid;place-items:center;font-size:12.5px;font-weight:700;
  }
  .stopf{display:flex;gap:8px;min-width:0}
  .stopnom{flex:1;min-width:0;padding:10px 12px;border-radius:13px}
  .stoph{width:74px;flex:none;padding:10px 8px;border-radius:13px;text-align:center;
    font-variant-numeric:tabular-nums}
  .stopact{display:flex;align-items:center;gap:6px}
  .pinbtn{
    font-size:12.5px;font-weight:700;padding:8px 11px;border-radius:12px;
    background:#FFF2E5;color:#C25A00;white-space:nowrap;
  }
  .pinbtn.ok{background:#E7F8EB;color:#1E9C41}
  .stopmove{display:flex;flex-direction:column;gap:3px}
  .stopmove button{
    width:26px;height:20px;border-radius:7px;background:var(--fill);
    color:var(--ink2);font-size:12px;line-height:1;
  }
  .stopmove button[disabled]{opacity:.3}

  .itinlink{
    display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);
    background:var(--fill);border:none;border-radius:20px;padding:14px 16px;margin-bottom:14px;
  }
  .itinlink:active{background:#ECECEE}
  .itinlink svg{
    width:40px;height:40px;flex:none;padding:8px;border-radius:50%;
    background:var(--green);color:#fff;box-sizing:border-box;
  }
  .itinlink.mini{padding:11px 14px;gap:11px}
  .itinlink.mini svg{width:32px;height:32px;padding:7px}
  .itinlink.mini span{font-size:14.5px}
  .itinlink span{font-size:16px;font-weight:600;line-height:1.25;min-width:0}
  .itinlink em{display:block;font-style:normal;font-size:13px;font-weight:400;color:var(--ink2);margin-top:2px}
  .itinlink b{margin-left:auto;font-weight:400;color:var(--ink3);font-size:16px}
  .mapwarn{font-size:12.5px;color:var(--ink3);margin:-6px 0 12px;line-height:1.4}
  .maplink{display:none}

  /* plaque */
  .plateline{display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap}
  .pastcol{
    display:inline-block;width:15px;height:15px;border-radius:50%;
    border:1.5px solid;vertical-align:-2px;margin-left:3px;
  }
  .swatches{display:flex;gap:9px;flex-wrap:wrap;margin-top:4px}
  .sw{
    width:44px;height:44px;border-radius:50%;border:2px solid transparent;
    position:relative;padding:0;
  }
  .sw i{
    display:block;width:100%;height:100%;border-radius:50%;
    border:1.5px solid rgba(0,0,0,.14);box-sizing:border-box;
  }
  .sw[aria-pressed="true"]{border-color:var(--blue)}

  }

    display:flex;align-items:center;justify-content:center;gap:6px;

  }

  @keyframes vue-in{
    from{opacity:0;transform:translate3d(calc(var(--dir,1) * 22px),8px,0)}

  #app.enter > *{animation:vue-in .42s cubic-bezier(.22,.92,.3,1) backwards}
  #app.enter > *:nth-child(1){animation-delay:0s}
  #app.enter > *:nth-child(2){animation-delay:.04s}
  #app.enter > *:nth-child(3){animation-delay:.08s}

  /* ====== TABLETTE : plus large, deux colonnes de trajets ====== */
  @media (min-width:680px){

  @media (min-width:1100px){

  @media (min-width:1500px){

    .masthead-in{max-width:1440px}
    .cards{grid-template-columns:repeat(auto-fit,minmax(400px,1fr))}

  /* survol : uniquement sur les appareils qui ont un pointeur */
  @media (hover:hover) and (pointer:fine){

  /* ====== panneaux : feuille en bas sur mobile, boîte centrée ailleurs ====== */
  @media (min-width:680px){
    .shback{align-items:center;padding:24px}
    .sheet{
      border-radius:32px;max-width:460px;max-height:86vh;

    }
    .grab{display:none}
    .sheet h4{padding-top:14px}
  }
  @keyframes popin{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}

  /* la barre d'onglets reste atteignable, sans écraser l'écran large */
  @media (min-width:680px){
    .rolebar{max-width:460px;bottom:calc(18px + env(safe-area-inset-bottom))}
  }

  /* écrans très courts : on récupère de la hauteur */
  @media (max-height:560px){
    .masthead{padding:14px 20px 10px}

  }

  /* l'animation d'entrée s'applique aussi aux fiches de la grille */
  #app.enter .cards > *{animation:vue-in .42s cubic-bezier(.22,.92,.3,1) backwards}
  #app.enter .cards > *:nth-child(1){animation-delay:.06s}
  #app.enter .cards > *:nth-child(2){animation-delay:.1s}
  #app.enter .cards > *:nth-child(3){animation-delay:.14s}
  #app.enter .cards > *:nth-child(n+4){animation-delay:.18s}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

   permet d'ajouter n'importe quel endroit qui n'y figure pas. */
const LIEUX_GROUPES = [
  {g:"Communes d'Abidjan", l:[
    "Abobo","Adjamé","Attécoubé","Cocody","Koumassi","Marcory",
    "Plateau","Port-Bouët","Treichville","Yopougon","Anyama","Bingerville","Songon"]},
  {g:"Quartiers et zones", l:[
    "Abobo Baoulé","Abobo Gare","Adjamé Liberté","Adjamé Renault","Akouédo","Angré",
    "Attoban","Biétry","Blockhauss","Deux-Plateaux","Gonzagueville","Koumassi Remblais",
    "Marcory Zone 4","Niangon","Palmeraie","Riviéra 2","Riviéra 3","Riviéra Bonoumin",

/* Sur un hébergement web ordinaire, window.storage n'existe pas :
   on retombe alors sur la mémoire locale du navigateur. */
const STORE = (typeof window !== 'undefined' && window.storage) ? window.storage : {
  get: async k => { const v = localStorage.getItem(k); return v === null ? null : {key:k, value:v}; },
  set: async (k,v) => { localStorage.setItem(k,v); return {key:k, value:v}; },
  delete: async k => { localStorage.removeItem(k); return {key:k, deleted:true}; },
  list: async () => ({keys:Object.keys(localStorage)})
};

async function load(){
  try{
    const r = await STORE.get(KEY);
    if(r && r.value){ db = JSON.parse(r.value); migrer(); return; }
  }catch(e){}
  db = seed(); save();
}

/* plaque fictive au format ivoirien, le temps de la démonstration */
function plaqueFictive(){
  const L = 'ABCDEFGHJKLMNPRSTVWXYZ';
  const l = () => L[Math.floor(Math.random()*L.length)];
  let p;
  do { p = l()+l()+'-'+(1000+Math.floor(Math.random()*9000))+'-CI'; }
  while(db.routes.some(t=>t.plaque===p));
  return p;
}

/* rattrape les données enregistrées avant l'ajout de certaines fonctions */
function migrer(){
  let change = false;
  db.users.forEach(u=>{ if(!u.mdp){ u.mdp='demo'; change=true; } });
  db.routes.forEach(t=>{ if(!t.plaque){ t.plaque=plaqueFictive(); change=true; } });
  if(!db.demandes){ db.demandes = []; change = true; }
  if(!db.interets){ db.interets = []; change = true; }
  db.users.forEach(u=>{
    if(u.photo){                       /* ancienne photo de compte */
      db.routes.filter(t=>t.owner===u.id && !t.chauffeurPhoto)
        .forEach(t=>{ t.chauffeurPhoto = u.photo; });
      delete u.photo; change = true;
    }
  });
  db.routes.forEach(t=>{
    if(t.actif   === undefined){ t.actif = true;  change = true; }
    if(t.clim    === undefined){ t.clim = false;  change = true; }
    if(t.verifie === undefined){ t.verifie = false; change = true; }
    if(!t.attente){ t.attente = []; change = true; }
    if(t.photos){ delete t.photos; change = true; }
    if(t.couleur === undefined){ t.couleur = ''; change = true; }
    if(t.arrets && t.arrets.some(a=>typeof a === 'string')){
      t.arrets = t.arrets.map(a=>{
        const p = litArret(a);
        const ll = LIEUX[cle(p.nom)];
        return ll ? {nom:p.nom, heure:p.heure, lat:ll[0], lng:ll[1]} : {nom:p.nom, heure:p.heure};
      });
      change = true;
    }
    if(!t.departPos && LIEUX[cle(t.depart)]){
      t.departPos = {lat:LIEUX[cle(t.depart)][0], lng:LIEUX[cle(t.depart)][1]}; change = true;
    }
    if(!t.arriveePos && LIEUX[cle(t.arrivee)]){
      t.arriveePos = {lat:LIEUX[cle(t.arrivee)][0], lng:LIEUX[cle(t.arrivee)][1]}; change = true;
    }
  });
  db.routes.forEach(t=>{
    if(!t.jdebut){
      const cap = m => m ? m[0].toUpperCase()+m.slice(1).toLowerCase() : '';
      const m = /^(\S+)\s+à\s+(\S+?)(?:,\s*sauf\s+(\S+))?$/i.exec(t.jours||'');
      t.jdebut = m? cap(m[1]) : 'Lundi';
      t.jfin   = m? cap(m[2]) : 'Vendredi';
      t.joff   = m && m[3] ? cap(m[3]) : '';
      change = true;
    }
  });
  if(!db.users.some(u=>u.statut==='admin')){
    db.users.push({id:'a1',nom:'Administrateur',tel:'0700000000',mdp:'admin2024',statut:'admin'});
    change = true;
  }
  if(change) save();
}

/* ============ utilitaires ============ */
/* transforme un trajet en points géolocalisés ; les lieux inconnus sont ignorés */
function pointsDe(t){
  const brut = [
    {nom:t.depart, type:'start', src:t.departPos},
    ...t.arrets.map(a=>{ const p = litArret(a); return {nom:p.nom, heure:p.heure, type:'stop', src:p}; }),
    {nom:t.arrivee, type:'end', src:t.arriveePos}
  ];
  const pts = [], absents = [];
  brut.forEach(p=>{
    const ll = positionDe(p.src, p.nom);
    if(ll) pts.push({...p, ll, precis: !!(p.src && Number.isFinite(p.src.lat))});
    else absents.push(p.nom);
  });
  return {pts, absents};
}

/* combien d'arrêts sont placés précisément sur la carte */
function precision(t){
  const tous = [t.departPos, ...t.arrets.map(litArret), t.arriveePos];
  const n = tous.length;
  const ok = tous.filter(x=>x && Number.isFinite(x.lat)).length;
  return {n, ok, complet: ok === n};
}

/* un arrêt peut porter son heure de passage : « Siporex 05:45 » */
function litArret(a){
  if(a && typeof a === 'object') return a;
  const m = /^(.*?)[\s·,]+(\d{1,2})[h:](\d{2})$/.exec((a||'').trim());
  return m ? {nom:m[1].trim(), heure:m[2].padStart(2,'0')+':'+m[3]}
           : {nom:(a||'').trim(), heure:''};
}

/* Coordonnées d'un point : celles placées à la main d'abord,
   le répertoire ensuite, sinon le point est ignoré. */
function positionDe(obj, nom){
  if(obj && Number.isFinite(obj.lat) && Number.isFinite(obj.lng)) return [obj.lat, obj.lng];
  const r = LIEUX[cle(nom !== undefined ? nom : (obj||{}).nom)];
  return r || null;
}

/* liste des jours parcourus du début à la fin, en bouclant sur la semaine */
function joursEntre(debut, fin){
  const i = JOURS.indexOf(debut), j = JOURS.indexOf(fin);
  if(i<0 || j<0) return [];
  const out = []; let k = i;
  for(let n=0; n<7; n++){ out.push(JOURS[k]); if(k===j) break; k=(k+1)%7; }
  return out;
}
function texteJours(debut, fin, off){
  if(debut === fin) return debut + ' uniquement';
  const base = debut + ' à ' + fin;
  return off ? base + ', sauf ' + off : base;
}

function depuis(ts){
  const m = Math.round((Date.now()-ts)/60000);
  if(m<60) return `il y a ${m} min`;
  const h = Math.round(m/60);
  if(h<24) return `il y a ${h} h`;
  return `il y a ${Math.round(h/24)} j`;
}

}

/* Dessine le macaron de vérification sur un canevas. */
function macaronCanvas(c, cx, cy, taille, couleur){
  const R = taille/2, r = R*0.836, N = 8;
  c.save();
  c.beginPath();
  for(let i = 0; i <= N; i++){
    const a0 = 2*Math.PI*i/N, a1 = 2*Math.PI*(i+0.5)/N;
    const x0 = cx + R*Math.cos(a0), y0 = cy + R*Math.sin(a0);
    if(i === 0) c.moveTo(x0, y0);
    if(i === N) break;
    const a2 = 2*Math.PI*(i+1)/N;
    c.quadraticCurveTo(cx + r*Math.cos(a1), cy + r*Math.sin(a1),
                       cx + R*Math.cos(a2), cy + R*Math.sin(a2));
  }
  c.closePath();
  /* la coche est découpée dans le macaron, pas posée dessus */
  const k = taille/24;
  const co = [[5.46,12.40],[10.54,17.47],[18.54,8.83],[16.63,7.06],[10.46,13.73],[7.30,10.56]];
  c.moveTo(cx + (co[0][0]-12)*k, cy + (co[0][1]-12)*k);
  co.slice(1).forEach(([x,y])=>c.lineTo(cx + (x-12)*k, cy + (y-12)*k));
  c.closePath();
  c.fillStyle = couleur;
  c.fill('evenodd');
  c.restore();
}

/* Réduit une photo à 320 px de côté, recadrée au centre, en JPEG léger.
   Indispensable : une photo de téléphone brute pèse 3 à 8 Mo. */
function compresserImage(file, opt){
  const {max = 320, carre = true, poids = 90000} = opt || {};
  return new Promise((ok, non)=>{
    if(!/^image\//.test(file.type)) return non(new Error("Ce fichier n'est pas une image."));
    const fr = new FileReader();
    fr.onerror = ()=>non(new Error('Lecture impossible.'));
    fr.onload = ()=>{
      const im = new Image();
      im.onerror = ()=>non(new Error('Image illisible.'));
      im.onload = ()=>{
        const cv = document.createElement('canvas');
        const c = cv.getContext('2d');
        if(carre){
          cv.width = cv.height = max;
          const cote = Math.min(im.width, im.height);
          c.drawImage(im, (im.width-cote)/2, (im.height-cote)/2, cote, cote, 0, 0, max, max);
        } else {                                  /* proportions conservées */
          const r = Math.min(1, max / Math.max(im.width, im.height));
          cv.width = Math.round(im.width * r);
          cv.height = Math.round(im.height * r);
          c.drawImage(im, 0, 0, cv.width, cv.height);
        }
        let q = 0.75, out = cv.toDataURL('image/jpeg', q);
        while(out.length > poids && q > 0.32){ q -= 0.09; out = cv.toDataURL('image/jpeg', q); }
        ok(out);
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
const compresserPhoto = f => compresserImage(f, {max:320, carre:true, poids:90000});


/* pastille d'identité : photo si elle existe, initiales sinon */
const TEINTES = ['#0381FE','#7B5CFA','#FF6B00','#3ACC5C','#FF4E8B'];
const teinteDe = id => TEINTES[(String(id)||'').split('')
  .reduce((a,ch)=>a+ch.charCodeAt(0), 0) % TEINTES.length];
const initiales = nom => (nom||'?').split(/\s+/).slice(0,2)
  .map(m=>m[0]||'').join('').toUpperCase();

function pastille({nom, photo, id}, taille){
  const cls = 'ava' + (taille ? ' '+taille : '');
  if(photo) return `<span class="${cls}"><img src="${photo}" alt=""></span>`;
  return `<span class="${cls}" style="background:${teinteDe(id||nom)}">${esc(initiales(nom))}</span>`;
}

/* le chauffeur d'une ligne ; à défaut, le propriétaire lui-même conduit */
function chauffeurDe(t){
  const o = user(t.owner);
  return t.chauffeur
    ? {nom:t.chauffeur, photo:t.chauffeurPhoto, id:t.id}
    : {nom:(o||{}).nom, photo:t.chauffeurPhoto, id:t.owner};
}

/* ============ carte de partage dessinée en image ============ */
function coinsArrondis(c,x,y,w,h,r){
  c.beginPath();
  if(c.roundRect){ c.roundRect(x,y,w,h,r); return; }
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}

async function imageDeCarte(t){
  const o = user(t.owner);
  const libre = Math.max(0, t.places - t.pris);
  const complet = libre === 0;
  const W = 1080, H = 1080, P = 60;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  const SANS = "'One UI Sans',-apple-system,BlinkMacSystemFont,'Samsung Sans',Roboto,Arial,sans-serif";

  const ch = chauffeurDe(t);
  /* la photo doit être décodée avant d'être dessinée */
  const photo = ch.photo ? await new Promise(res=>{
    const im = new Image();
    im.onload = ()=>res(im); im.onerror = ()=>res(null);
    im.src = ch.photo;
  }) : null;

  /* fond gris clair, carte blanche : les codes One UI */
  c.fillStyle = '#F1F1F1'; c.fillRect(0,0,W,H);
  c.textBaseline = 'alphabetic';

  c.font = '700 38px '+SANS; c.fillStyle = '#0A0A0A';
  c.fillText('Ligne', P+8, 82);
  const wl = c.measureText('Ligne ').width;
  c.fillStyle = '#0381FE'; c.fillText(' Abidjan', P+8+wl-6, 82);
  c.font = '400 23px '+SANS; c.fillStyle = '#69696E';
  c.fillText('Abonnements car dans le Grand Abidjan', P+8, 116);

  const px = P, py = 152, pw = W-P*2, ph = 726;
  coinsArrondis(c, px, py, pw, ph, 56);
  c.fillStyle = '#FFFFFF'; c.fill();

  const IX = px + 44, IW = pw - 88;
  let y = py + 84;

  /* trajet, police adaptative */
  const dep = t.depart, arr = t.arrivee;
  let ts = 60;
  while(ts > 44){
    c.font = '700 '+ts+'px '+SANS;
    if(c.measureText(dep + '  →  ' + arr).width <= IW) break;
    ts -= 3;
  }
  c.font = '700 '+ts+'px '+SANS; c.fillStyle = '#0A0A0A';
  if(c.measureText(dep + '  →  ' + arr).width <= IW){
    c.fillText(dep, IX, y);
    const w1 = c.measureText(dep).width;
    c.fillStyle = '#0381FE'; c.fillText('  →  ', IX+w1, y);
    const w2 = c.measureText('  →  ').width;
    c.fillStyle = '#0A0A0A'; c.fillText(arr, IX+w1+w2, y);
    if(t.verifie){
      const bx = IX + w1 + w2 + c.measureText(arr).width + ts*0.34;
      macaronCanvas(c, bx, y - ts*0.30, ts*0.52, '#2FBF5B');
    }
    y += 76;
  } else {
    c.font = '700 56px '+SANS; c.fillText(dep, IX, y); y += 64;
    c.fillStyle = '#0381FE'; c.font = '700 46px '+SANS; c.fillText('→ ', IX, y);
    const wa = c.measureText('→ ').width;
    c.fillStyle = '#0A0A0A'; c.font = '700 56px '+SANS; c.fillText(arr, IX+wa, y);
    if(t.verifie) macaronCanvas(c, IX+wa+c.measureText(arr).width+20, y-17, 30, '#2FBF5B');
    y += 72;
  }

  /* prix dans une pastille bleue claire */
  const pr = fcfa(t.prix);
  c.font = '700 70px '+SANS; const wp = c.measureText(pr).width;
  c.font = '600 28px '+SANS; const wu = c.measureText(' FCFA / mois').width;
  coinsArrondis(c, IX, y-4, wp+wu+60, 94, 30);
  c.fillStyle = '#EAF3FF'; c.fill();
  c.fillStyle = '#0381FE'; c.font = '700 70px '+SANS;
  c.fillText(pr, IX+30, y+62);
  c.fillStyle = '#5B8FD0'; c.font = '600 28px '+SANS;
  c.fillText(' FCFA / mois', IX+30+wp, y+62);
  y += 136;

  c.font = '600 33px '+SANS; c.fillStyle = '#0A0A0A';
  c.fillText('↑ ' + t.aller + '     ↓ ' + t.retour, IX, y); y += 44;
  c.font = '400 29px '+SANS; c.fillStyle = '#69696E';
  c.fillText(texteJours(t.jdebut, t.jfin, t.joff), IX, y); y += 28;

  /* étiquettes */
  const tags = [];
  if(t.clim)    tags.push(['❄ Climatisé', '#F4F4F5', '#69696E']);
  if(tags.length){
    y += 34; let tx = IX;
    tags.forEach(([txt,bgc,fgc])=>{
      c.font = '700 25px '+SANS;
      const w = c.measureText(txt).width + 42;
      coinsArrondis(c, tx, y-4, w, 50, 25);
      c.fillStyle = bgc; c.fill();
      c.fillStyle = fgc; c.fillText(txt, tx+21, y+30);
      tx += w + 12;
    });
    y += 62;
  } else y += 24;

  /* jauge */
  const gh = 16, gw = IW;
  coinsArrondis(c, IX, y, gw, gh, 8); c.fillStyle = '#EDEDEF'; c.fill();
  coinsArrondis(c, IX, y, Math.max(gh, gw*(t.pris/t.places)), gh, 8);
  c.fillStyle = complet ? '#FF6B00' : '#3ACC5C'; c.fill();
  y += 56;
  c.font = '700 33px '+SANS; c.fillStyle = complet ? '#D3271B' : '#1E9C41';
  c.fillText(complet ? "Complet — liste d'attente"
    : libre + ' place' + (libre>1?'s':'') + ' libre' + (libre>1?'s':''), IX, y);
  c.font = '400 27px '+SANS; c.fillStyle = '#A0A0A5';
  const nb = t.pris+'/'+t.places+' abonnés';
  c.fillText(nb, IX+IW-c.measureText(nb).width, y);

  /* plaque */
  y += 78;
  if(t.plaque){
    c.font = '700 42px '+SANS;
    const bw = c.measureText(t.plaque).width + 128, bh = 74;
    coinsArrondis(c, IX, y-6, bw, bh, 14);
    c.fillStyle = '#F7F7F8'; c.fill();
    c.strokeStyle = '#DCDCE0'; c.lineWidth = 3; c.stroke();
    coinsArrondis(c, IX, y-6, 54, bh, 14); c.save(); c.clip();
    c.fillStyle = '#0B3A8C'; c.fillRect(IX, y-6, 54, bh); c.restore();
    c.fillStyle = '#fff'; c.font = '700 21px '+SANS; c.fillText('CI', IX+13, y+50);
    c.fillStyle = '#0A0A0A'; c.font = '700 42px '+SANS; c.fillText(t.plaque, IX+78, y+44);

    /* pastille de couleur, collée à la plaque */
    const co = couleurDe(t.couleur);
    if(co){
      const dx = IX + bw + 24, dy = y + 30;
      c.beginPath(); c.arc(dx+15, dy, 15, 0, Math.PI*2);
      c.fillStyle = co.h; c.fill();
      c.strokeStyle = co.b; c.lineWidth = 2.5; c.stroke();
      c.fillStyle = '#0A0A0A'; c.font = '600 26px '+SANS;
      c.fillText('Car ' + co.n.toLowerCase(), dx + 40, dy + 9);
    }

    /* chauffeur, aligné à droite sur la même ligne */
    const AV = 74, ax = IX + IW - AV, ay = y - 6;
    c.save();
    c.beginPath(); c.arc(ax+AV/2, ay+AV/2, AV/2, 0, Math.PI*2); c.clip();
    if(photo){ c.drawImage(photo, ax, ay, AV, AV); }
    else {
      c.fillStyle = teinteDe(ch.id); c.fillRect(ax, ay, AV, AV);
      c.fillStyle = '#fff'; c.font = '700 28px '+SANS;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(initiales(ch.nom), ax+AV/2, ay+AV/2+1);
      c.textAlign = 'start'; c.textBaseline = 'alphabetic';
    }
    c.restore();
    c.fillStyle = '#A0A0A5'; c.font = '400 20px '+SANS;
    const lbl = 'Chauffeur';
    c.fillText(lbl, ax - c.measureText(lbl).width - 16, y+22);
    c.fillStyle = '#0A0A0A'; c.font = '600 26px '+SANS;
    const pn = ch.nom.split(/\s+/)[0];
    c.fillText(pn, ax - c.measureText(pn).width - 16, y+52);
  }

  /* contact : c'est le propriétaire qu'on appelle pour s'abonner */
  const cy = py + ph + 62;
  c.fillStyle = '#69696E'; c.font = '400 27px '+SANS;
  c.fillText('Pour vous abonner, contactez', P+8, cy);
  c.fillStyle = '#0A0A0A'; c.font = '700 46px '+SANS;
  c.fillText(o.nom, P+8, cy+56);
  c.fillStyle = '#0381FE'; c.font = '700 44px '+SANS;
  c.fillText(o.tel.replace(/(\d{2})(?=\d)/g,'$1 '), P+8, cy+114);

  return new Promise(res=>cv.toBlob(res, 'image/png'));
}

let filtre = {q:'',de:'',vers:'',libre:false,tri:'places'};

function vueVisiteur(){
  const opts = v => LIEUX_GROUPES.map(gr=>
    `<optgroup label="${esc(gr.g)}">${gr.l.map(c=>
      `<option ${c===v?'selected':''}>${esc(c)}</option>`).join('')}</optgroup>`).join('');
  let liste = db.routes.filter(t=>user(t.owner).statut==='actif' && t.actif!==false);

  if(filtre.q){
    const q = cle(filtre.q);
    liste = liste.filter(t=>
      [t.depart, t.arrivee, ...t.arrets.map(a=>litArret(a).nom)]
        .some(x=>cle(x).includes(q)));
  }
  if(filtre.de)   liste = liste.filter(t=>t.depart===filtre.de);
  if(filtre.vers) liste = liste.filter(t=>t.arrivee===filtre.vers);
  if(filtre.libre)liste = liste.filter(t=>t.places-t.pris>0);

  liste = liste.slice().sort((a,b)=>{
    if(filtre.tri==='prix')   return a.prix - b.prix;
    if(filtre.tri==='depart') return a.aller.localeCompare(b.aller);
    return (b.places-b.pris) - (a.places-a.pris);
  });

  const tris = [['places','Places libres'],['prix','Prix'],['depart','Heure de départ']];

  /* économie réelle, calculée sur les lignes publiées */
  const actifs = db.routes.filter(t=>user(t.owner).statut==='actif' && t.actif!==false);
  const prixMoyen = actifs.length
    ? Math.round(actifs.reduce((a,t)=>a+t.prix,0)/actifs.length/500)*500 : 25000;
  const gainMoyen = Math.max(0, 44000 - prixMoyen);

  /* quelques lignes mises en avant : les moins chères ayant encore des places */
  const vedettes = actifs.filter(t=>t.places-t.pris>0)
    .sort((a,b)=>a.prix-b.prix).slice(0,4);

  return `<div id="ancre-recherche"></div>
  <section class="hero">
    ${ILLU_HERO}
    <h1>Votre car pour aller au travail, à l'abonnement.</h1>
    <p>Place assise garantie, tarif mensuel, contact direct avec le propriétaire.
    ${gainMoyen>0? `Environ <b>${fcfa(gainMoyen)} FCFA d'économie par mois</b> face au woro-woro et au gbaka.`:''}</p>
  </section>

  <section class="search bloc">
    <div class="srow">
      <label for="f-de">De</label>
      <select id="f-de"><option value="">Toutes communes</option>${opts(filtre.de)}</select>
      <button class="swap" id="f-swap" title="Inverser" aria-label="Inverser départ et arrivée">⇅</button>
    </div>
    <div class="srow">
      <label for="f-vers">Vers</label>
      <select id="f-vers"><option value="">Toutes communes</option>${opts(filtre.vers)}</select>
    </div>
    <div class="srow">
      <label for="f-q">Quartier ou arrêt</label>
      <input id="f-q" type="search" placeholder="Siporex, Angré, Gesco…" value="${esc(filtre.q)}">
    </div>
    <div class="srow srow-t">
      <label class="toggle" style="margin:0"><input type="checkbox" id="f-libre" ${filtre.libre?'checked':''}>
        Seulement les cars qui ont des places</label>
    </div>
    <button class="sgo" id="f-go">Voir ${liste.length} trajet${liste.length>1?'s':''}</button>
  </section>

  ${vedettes.length? `<div class="vedettes">
    <h3>Lignes populaires</h3>
    <div class="vrail">${vedettes.map(t=>`<button class="vcard" data-go="${t.id}">
      <span class="vline">
        <span class="vpt"><i></i>${esc(t.depart)}</span>
        <span class="vpt"><i></i>${esc(t.arrivee)}</span>
      </span>
      <span class="vbas">
        <span><em>Dès</em><b>${fcfa(t.prix)}</b><em> F/mois</em></span>
        <span class="vfleche" aria-hidden="true">→</span>
      </span>
      <span class="vplaces">${t.places-t.pris} place${t.places-t.pris>1?'s':''} libre${t.places-t.pris>1?'s':''}</span>
    </button>`).join('')}</div>
  </div>`:''}

  <div class="sortbar">${tris.map(([k,lbl])=>
    `<button class="sortb" data-tri="${k}" aria-pressed="${filtre.tri===k}">${lbl}</button>`).join('')}</div>

  <div class="count">${liste.length} trajet${liste.length>1?'s':''} trouvé${liste.length>1?'s':''}</div>
  ${liste.length? `<div class="cards">${liste.map(carte).join('')}</div>` :
    `<div class="empty"><b>Aucun car sur ce trajet</b>
     Signalez-le : si plusieurs personnes demandent la même ligne, nous cherchons un propriétaire pour la desservir.
     <button class="save" id="dem-open" style="margin-top:16px">Demander cette ligne</button></div>`}

  ${liste.length? `<div class="panel">
    <div class="ph"><span class="ico k">◎</span><h3>Votre trajet n'existe pas ?</h3></div>
    <p class="sub">Dites-nous où vous allez. Les lignes les plus demandées sont proposées en priorité
    aux propriétaires de car.</p>
    <button class="save" id="dem-open">Demander une ligne</button>
  </div>`:''}

  <section class="piliers">
    <div>${ILLU_VERIF}
      <b>Véhicules vérifiés</b>
      <p>Carte grise, assurance et visite technique contrôlées avant l'affichage du macaron.</p></div>
    <div>${ILLU_PLACE}
      <b>Place garantie</b>
      <p>Vous voyez le nombre de places restantes avant d'appeler. Pas de course le matin.</p></div>
    <div>${ILLU_HEURE}
      <b>Horaires fixes</b>
      <p>Heure de passage à chaque arrêt, jours de service, heure de retour.</p></div>
  </section>

  <section class="proprio-cta">
    ${ILLU_CTA}
    <h3>Vous avez un car ?</h3>
    <p>Un car de 22 places à ${fcfa(prixMoyen)} FCFA rapporte <b>${fcfa(prixMoyen*22)} FCFA par mois</b>
    une fois rempli. Chaque place vide vous coûte ${fcfa(prixMoyen)} FCFA.
    Publiez votre ligne et remplissez-la au-delà de votre entourage.</p>
    <button class="save" data-onglet="proprio">Publier ma ligne</button>
  </section>

  <p class="note">Les abonnements se règlent directement avec le propriétaire du car.
  Vérifiez toujours la plaque et la couleur avant de monter.</p>`;
}

/* Demandes regroupées par trajet, les plus réclamées d'abord. */
function demandesGroupees(){
  const g = {};
  (db.demandes||[]).forEach(d=>{
    const k = d.de+' → '+d.vers;
    (g[k] = g[k] || {ligne:k, de:d.de, vers:d.vers, gens:[]}).gens.push(d);
  });
  return Object.values(g).sort((a,b)=>b.gens.length - a.gens.length);
}
const interesses = ligne => (db.interets||[]).filter(i=>i.ligne===ligne);

/* place la pastille sous l'onglet actif ; anim=false pour un placement instantané */
const LARGEUR_PASTILLE = 64;

/* centre la pastille sur l'icône de l'onglet actif */
function placerGlide(anim){
  const g = document.querySelector('.glide');
  const b = document.querySelector('.rolebtn[aria-pressed="true"]');
  if(!g || !b || !b.offsetWidth) return;   /* barre masquée sur grand écran */
  if(!anim) g.style.transition = 'none';
  const x = b.offsetLeft + (b.offsetWidth - LARGEUR_PASTILLE) / 2;
  g.style.width = LARGEUR_PASTILLE + 'px';
  g.style.transform = 'translate3d(' + x.toFixed(1) + 'px,0,0)';
  if(!anim) requestAnimationFrame(()=>{ g.style.transition = ''; });
}

function render(sens){
  document.querySelectorAll('.rolebtn').forEach(b=>
    b.setAttribute('aria-pressed', b.dataset.role===role));
  document.querySelectorAll('[data-tb]').forEach(b=>
    b.setAttribute('aria-current', b.dataset.tb===role && !b.classList.contains('tb-logo')));
  placerGlide(!premierRendu);

  const app = document.getElementById('app');
  app.innerHTML = role==='visiteur'? vueVisiteur() : role==='proprio'? vueProprio() : vueAdmin();

  if(sens){                                   /* uniquement lors d'un changement d'onglet */

    app.classList.remove('enter');
    void app.offsetWidth;                     /* force le navigateur à rejouer l'animation */
    app.classList.add('enter');

  premierRendu = false;
  brancher();
}

/* Remplace chaque liste déroulante du système par un panneau coulissant.
   Le <select> reste dans la page et garde la valeur : les gestionnaires
   existants continuent de fonctionner sans modification. */
const CHEV = `<svg class="c" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>`;
const TICK = `<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>`;

function ouvrirFeuille(sel, trig){
  const titre = (document.querySelector('label[for="'+sel.id+'"]')?.textContent || 'Choisir').trim();
  const options = [...sel.options];
  const long = options.length > 10;

  const back = document.createElement('div');
  back.className = 'shback';
  back.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(titre)}">
      <span class="grab" aria-hidden="true"></span>
      <h4>${esc(titre)}</h4>
      ${long? `<div class="shcherche"><input type="search" id="sh-q"
        placeholder="Rechercher un lieu…" autocomplete="off"></div>`:''}
      <ul class="shlist" id="sh-l"></ul>
      <button class="shclose" type="button">Annuler</button>
    </div>`;

  const liste = back.querySelector('#sh-l');
  function peupler(q){
    const cq = cle(q||'');
    let html = '', groupe = null, vus = 0;
    options.forEach((op,i)=>{
      if(cq && !cle(op.textContent).includes(cq) && op.value !== '__autre__') return;
      const g = op.parentElement && op.parentElement.tagName === 'OPTGROUP'
        ? op.parentElement.label : null;
      if(g && g !== groupe && !cq){ html += `<li class="shgrp">${esc(g)}</li>`; groupe = g; }
      const spec = op.value === '__autre__';
      html += `<li><button type="button" data-i="${i}" aria-selected="${op.selected}"
        ${spec? 'class="shautre"':''}>${esc(op.textContent)}${spec? '':TICK}</button></li>`;
      if(!spec) vus++;
    });
    if(cq && vus === 0) html = `<li class="shvide">Aucun lieu trouvé pour « ${esc(q)} ».<br>
      Utilisez « Autre lieu… » pour l'ajouter.</li>` + html;
    liste.innerHTML = html;
    brancherChoix();
  }

  const fermer = ()=>{
    back.remove();
    document.body.style.overflow = '';
    trig.setAttribute('aria-expanded','false');
    trig.focus();
  };
  back.onclick = e=>{ if(e.target === back) fermer(); };
  back.querySelector('.shclose').onclick = fermer;
  function brancherChoix(){
    liste.querySelectorAll('button').forEach(b=>b.onclick = ()=>{
      const op = options[+b.dataset.i];
      if(op.value === '__autre__'){
        fermer();
        ouvrirFormulaire({
          titre:'Autre lieu',
          sous:"Saisissez le nom du quartier, du carrefour ou de la ville. Il sera ajouté à ce trajet.",
          action:'Utiliser ce lieu',
          champs:[{id:'nom', label:'Nom du lieu', exemple:'Carrefour Gesco'}],
          verifier:v=> v.nom.length < 3 ? 'Indiquez un nom d\'au moins 3 caractères.' : '',
          valider:v=>{
            const o = document.createElement('option');
            o.textContent = v.nom; o.value = v.nom;
            sel.insertBefore(o, sel.querySelector('[value="__autre__"]'));
            sel.value = v.nom;
            sel.dispatchEvent(new Event('change', {bubbles:true}));
          }
        });
        return;
      }
      fermer();
      if(op.value !== sel.value){
        sel.value = op.value;
        sel.dispatchEvent(new Event('change', {bubbles:true}));
      }
    });
  }
  addEventListener('keydown', function esc2(e){
    if(e.key === 'Escape'){ fermer(); removeEventListener('keydown', esc2); }
  });

  peupler('');
  const q = back.querySelector('#sh-q');
  if(q) q.oninput = e=>peupler(e.target.value);

  document.body.appendChild(back);
  document.body.style.overflow = 'hidden';
  trig.setAttribute('aria-expanded','true');
  back.querySelector('[aria-selected="true"]')?.scrollIntoView({block:'center'});
}

/* Panneau de saisie réutilisable : remplace les fenêtres prompt(),
   bloquées dans certains contextes et étrangères au design. */
/* Extrait des coordonnées d'un lien Google Maps ou d'un couple collé. */
function extraireCoord(txt){
  const t = (txt||'').trim();
  if(!t) return null;
  const essais = [
    /@(-?\d+\.\d+),\s*(-?\d+\.\d+)/,        /* .../@5.331,-4.084,17z   */
    /[?&]q=(-?\d+\.\d+),\s*(-?\d+\.\d+)/,    /* ...?q=5.331,-4.084      */
    /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/,        /* ...!3d5.331!4d-4.084    */
    /^(-?\d+[.,]\d+)\s*[,;\s]\s*(-?\d+[.,]\d+)$/  /* 5.331, -4.084      */
  ];
  for(const re of essais){
    const m = re.exec(t);
    if(m){
      const la = parseFloat(m[1].replace(',','.'));
      const lo = parseFloat(m[2].replace(',','.'));
      if(Number.isFinite(la) && Number.isFinite(lo)) return {lat:la, lng:lo};
    }
  }
  return null;
}

const estRaccourci = t => /(maps\.app\.goo\.gl|goo\.gl\/maps|g\.co\/kgs)/i.test(t||'');

/* Un lien raccourci ne contient aucune coordonnée : il faut le déplier.
   Le navigateur ne peut pas lire la redirection lui-même (sécurité inter-sites),
   on passe donc par un relais public. Si aucun ne répond, on bascule sur la
   méthode manuelle. */
async function deplierLien(url){
  const relais = [
    u => 'https://api.allorigins.win/get?url=' + encodeURIComponent(u),
    u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
    u => 'https://r.jina.ai/' + u
  ];
  for(const faire of relais){
    try{
      const ctrl = new AbortController();
      const minuteur = setTimeout(()=>ctrl.abort(), 7000);
      const rep = await fetch(faire(url), {signal:ctrl.signal});
      clearTimeout(minuteur);
      if(!rep.ok) continue;
      const brut = await rep.text();
      /* l'adresse finale ou le contenu de la page contiennent les coordonnées */
      let c = extraireCoord(brut);
      if(!c){
        try{
          const j = JSON.parse(brut);
          c = extraireCoord((j.status && j.status.url) || '') || extraireCoord(j.contents || '');
        }catch(e){}
      }
      if(c && dansAbidjan(c.lat, c.lng)) return c;
      if(c) return c;
    }catch(e){ /* relais injoignable, on essaie le suivant */ }
  }
  return null;
}

/* Placement précis sans carte : on relève le point dans Google Maps,
   puis on colle le lien ou les coordonnées. Fonctionne même hors ligne. */
function ouvrirPointeur(titre, depart, valider){
  const base = depart && Number.isFinite(depart.lat)
    ? [depart.lat, depart.lng] : [5.345, -4.020];
  const lienMaps = 'https://www.google.com/maps/@' + base[0] + ',' + base[1] + ',16z';

  const back = document.createElement('div');
  back.className = 'shback';
  back.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(titre)}">
      <span class="grab" aria-hidden="true"></span>
      <h4>${esc(titre)}</h4>
      <div class="shform">
        <ol class="modeop">
          <li>Ouvrez Google Maps et trouvez l'endroit exact de l'arrêt.</li>
          <li><b>Appuyez longuement</b> dessus : une épingle rouge apparaît et
              les coordonnées s'affichent en haut, du type <b>5.33124, -4.08457</b>.</li>
          <li>Touchez ces coordonnées pour les copier.</li>
          <li>Revenez ici et collez.</li>
        </ol>
        <p class="modeop" style="padding:0;list-style:none">Un lien de partage fonctionne aussi :
        il sera déplié automatiquement.</p>
        <a class="itinlink mini" href="${lienMaps}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 21s7-6.3 7-11a7 7 0 10-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/>
          </svg>
          <span>Ouvrir Google Maps<em>pour relever le point</em></span><b>↗</b>
        </a>
        <div class="field" style="margin-top:4px">
          <label for="pt-in">Lien ou coordonnées</label>
          <input id="pt-in" placeholder="https://maps.app.goo.gl/…  ou  5.331240, -4.084570"
            value="${depart && Number.isFinite(depart.lat)? depart.lat+', '+depart.lng : ''}">
        </div>
        <p class="ptetat" id="pt-etat"></p>
      </div>
      <div class="crow">
        <button type="button" class="shclose" id="pt-non">Annuler</button>
        <button type="button" class="save" id="pt-oui" disabled>Enregistrer</button>
      </div>
    </div>`;

  const champ = back.querySelector('#pt-in');
  const etat  = back.querySelector('#pt-etat');
  const ok    = back.querySelector('#pt-oui');
  let trouve = null;

  function verifier(){
    const c = extraireCoord(champ.value);
    trouve = null;
    if(!champ.value.trim()){
      etat.className = 'ptetat'; etat.textContent = '';
      ok.disabled = true; return;
    }
    if(!c){
      if(estRaccourci(champ.value)){ resoudre(champ.value.trim()); return; }
      etat.className = 'ptetat ko';
      etat.textContent = "Aucune coordonnée trouvée. Collez un lien Google Maps ou deux nombres séparés par une virgule.";
      ok.disabled = true; return;
    }
    if(!dansAbidjan(c.lat, c.lng)){
      etat.className = 'ptetat ko';
      etat.textContent = 'Ce point est hors du Grand Abidjan (' 
        + c.lat.toFixed(5) + ', ' + c.lng.toFixed(5) + '). Vérifiez le lien.';
      ok.disabled = true; return;
    }
    trouve = c;
    etat.className = 'ptetat oui';
    etat.textContent = '✓ Position reconnue : ' + c.lat.toFixed(5) + ', ' + c.lng.toFixed(5);
    ok.disabled = false;
  }
  let enCours = null;
  async function resoudre(url){
    if(enCours === url) return;
    enCours = url;
    etat.className = 'ptetat att';
    etat.innerHTML = '<span class="spin" aria-hidden="true"></span> Lien raccourci — récupération de la position…';
    ok.disabled = true;
    const c = await deplierLien(url);
    if(champ.value.trim() !== url) return;          /* le champ a changé entre-temps */
    if(c && dansAbidjan(c.lat, c.lng)){
      trouve = c;
      etat.className = 'ptetat oui';
      etat.textContent = '✓ Position retrouvée : ' + c.lat.toFixed(5) + ', ' + c.lng.toFixed(5);

    } else {
      etat.className = 'ptetat ko';
      etat.innerHTML = "Impossible de déplier ce lien automatiquement."
        + ` <a href="${esc(url)}" target="_blank" rel="noopener" class="lienouvre">Ouvrir le lien</a>,`
        + " puis copiez les coordonnées affichées en haut de Google Maps.";
      ok.disabled = true;
    }
    enCours = null;
  }

  champ.oninput = verifier;
  champ.onpaste = ()=>setTimeout(verifier, 30);
  verifier();

  const fermer = ()=>{ back.remove(); document.body.style.overflow=''; };
  back.onclick = e=>{ if(e.target === back) fermer(); };
  back.querySelector('#pt-non').onclick = fermer;
  ok.onclick = ()=>{
    if(!trouve) return;
    fermer();
    valider({lat:+trouve.lat.toFixed(6), lng:+trouve.lng.toFixed(6)});
  };

  document.body.appendChild(back);
  document.body.style.overflow = 'hidden';
  setTimeout(()=>champ.focus(), 120);
}

const telValide = t => t.replace(/\D/g,'').length >= 10;

function ouvrirHorloge(inp, trig){
  const titre = (document.querySelector('label[for="'+inp.id+'"]')?.textContent || 'Heure').trim();
  const dep = (inp.value || '05:30').split(':');
  let hh = Math.max(0, Math.min(23, parseInt(dep[0],10) || 0));
  let mm = Math.min(55, Math.round((parseInt(dep[1],10) || 0) / 5) * 5);
  let mode = 'h';

  const CX = 144, CY = 144, R_EXT = 116, R_INT = 78, R_MIN = 116;
  const pos = (idx, r) => {
    const a = (idx * 30 - 90) * Math.PI / 180;
    return [CX + r * Math.cos(a), CY + r * Math.sin(a)];
  };
  const deuxCh = n => String(n).padStart(2, '0');

  const back = document.createElement('div');
  back.className = 'shback';
  back.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(titre)}">
      <span class="grab" aria-hidden="true"></span>
      <h4>${esc(titre)}</h4>
      <div class="tdisp">
        <button type="button" id="t-h"></button><i>:</i><button type="button" id="t-m"></button>
      </div>
      <div class="cwrap"><svg class="cface" id="t-face" viewBox="0 0 288 288"></svg></div>
      <div class="cpre">
        ${['05:00','05:30','06:00','17:00','18:00','18:30'].map(v=>
          `<button type="button" data-pre="${v}">${v}</button>`).join('')}
      </div>
      <div class="crow">
        <button type="button" class="shclose" id="t-non">Annuler</button>
        <button type="button" class="save" id="t-oui">Valider</button>
      </div>
    </div>`;

  const face = back.querySelector('#t-face');
  const bh = back.querySelector('#t-h'), bm = back.querySelector('#t-m');

  function dessine(){
    bh.textContent = deuxCh(hh); bm.textContent = deuxCh(mm);
    bh.setAttribute('aria-current', mode === 'h');
    bm.setAttribute('aria-current', mode === 'm');

    let g = `<circle class="dial" cx="${CX}" cy="${CY}" r="138"/>`;
    const sel = mode === 'h' ? (hh % 12) : (mm / 5);
    const rSel = mode === 'h' ? ((hh === 0 || hh > 12) ? R_INT : R_EXT) : R_MIN;
    const [sx, sy] = pos(sel, rSel);

    g += `<line class="hand" x1="${CX}" y1="${CY}" x2="${sx}" y2="${sy}"/>
          <circle class="knob" cx="${sx}" cy="${sy}" r="21"/>
          <circle class="core" cx="${CX}" cy="${CY}" r="4"/>`;

    for(let i = 0; i < 12; i++){
      if(mode === 'h'){
        const hExt = i === 0 ? 12 : i;
        const hInt = i === 0 ? 0 : i + 12;
        const [x1,y1] = pos(i, R_EXT), [x2,y2] = pos(i, R_INT);
        g += `<text class="num${hh===hExt?' on':''}" x="${x1}" y="${y1}">${deuxCh(hExt)}</text>`;
        g += `<text class="num min24${hh===hInt?' on':''}" x="${x2}" y="${y2}">${deuxCh(hInt)}</text>`;
      } else {
        const v = i * 5;
        const [x,y] = pos(i, R_MIN);
        g += `<text class="num${mm===v?' on':''}" x="${x}" y="${y}">${deuxCh(v)}</text>`;
      }
    }
    face.innerHTML = g;
  }

  let glisse = false;
  function viser(e){
    const r = face.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * 288 - CX;
    const y = (e.clientY - r.top) / r.height * 288 - CY;
    let a = Math.atan2(y, x) * 180 / Math.PI + 90;
    if(a < 0) a += 360;
    const idx = Math.round(a / 30) % 12;
    if(mode === 'h'){
      const interieur = Math.hypot(x, y) < (R_EXT + R_INT) / 2;
      hh = interieur ? (idx === 0 ? 0 : idx + 12) : (idx === 0 ? 12 : idx);
    } else {
      mm = idx * 5;
    }
    dessine();
  }
  face.addEventListener('pointerdown', e=>{ glisse = true; face.setPointerCapture(e.pointerId); viser(e); });
  face.addEventListener('pointermove', e=>{ if(glisse) viser(e); });
  face.addEventListener('pointerup', ()=>{
    glisse = false;
    if(mode === 'h'){ mode = 'm'; dessine(); }   /* enchaîne sur les minutes */
  });

  bh.onclick = ()=>{ mode = 'h'; dessine(); };
  bm.onclick = ()=>{ mode = 'm'; dessine(); };
  back.querySelectorAll('[data-pre]').forEach(b=>b.onclick = ()=>{
    const [a,b2] = b.dataset.pre.split(':');
    hh = +a; mm = +b2; mode = 'm'; dessine();
  });

  const fermer = ()=>{
    back.remove();
    document.body.style.overflow = '';
    trig.setAttribute('aria-expanded','false');
    trig.focus();
  };
  back.onclick = e=>{ if(e.target === back) fermer(); };
  back.querySelector('#t-non').onclick = fermer;
  back.querySelector('#t-oui').onclick = ()=>{
    const val = deuxCh(hh) + ':' + deuxCh(mm);
    fermer();
    if(val !== inp.value){
      inp.value = val;
      inp.dispatchEvent(new Event('change', {bubbles:true}));
    }
    trig.querySelector('.v').textContent = val;
  };
  addEventListener('keydown', function esc3(e){
    if(e.key === 'Escape'){ fermer(); removeEventListener('keydown', esc3); }
  });

  dessine();
  document.body.appendChild(back);
  document.body.style.overflow = 'hidden';
  trig.setAttribute('aria-expanded','true');
}

/* Liste modifiable des arrêts, avec position sur la carte. */
function rendreStops(){
  const zone = document.getElementById('n-stops');
  if(!zone) return;
  const L = brouillonStops || [];
  zone.innerHTML = L.length ? L.map((a,i)=>{
    const place = Number.isFinite(a.lat);
    return `<div class="stoprow">
      <span class="stopnum">${i+1}</span>
      <div class="stopf">
        <input class="stopnom" data-i="${i}" placeholder="Nom de l'arrêt" value="${esc(a.nom||'')}">
        <input class="stoph" data-i="${i}" placeholder="--:--" maxlength="5" value="${esc(a.heure||'')}">
      </div>
      <div class="stopact">
        <button type="button" class="pinbtn ${place?'ok':''}" data-pin="${i}"
          title="${place?'Modifier la position':'Placer sur la carte'}">${place?'✓ placé':'⌖ placer'}</button>
        <button type="button" class="link" data-rmstop="${i}" aria-label="Supprimer">✕</button>
      </div>
      <div class="stopmove">
        <button type="button" data-up="${i}" ${i===0?'disabled':''} aria-label="Monter">↑</button>
        <button type="button" data-down="${i}" ${i===L.length-1?'disabled':''} aria-label="Descendre">↓</button>
      </div>
    </div>`;
  }).join('') : '<p class="mapwarn" style="margin:2px 0 0">Aucun arrêt intermédiaire : trajet direct.</p>';

  zone.querySelectorAll('.stopnom').forEach(i=>i.oninput = e=>{ L[+i.dataset.i].nom = e.target.value; });
  zone.querySelectorAll('.stoph').forEach(i=>i.oninput = e=>{
    let v = e.target.value.replace(/[^\d:]/g,'');
    if(v.length === 2 && !v.includes(':')) v += ':';
    e.target.value = v.slice(0,5);
    L[+i.dataset.i].heure = e.target.value;
  });
  zone.querySelectorAll('[data-rmstop]').forEach(b=>b.onclick = ()=>{ L.splice(+b.dataset.rmstop,1); rendreStops(); });
  zone.querySelectorAll('[data-up]').forEach(b=>b.onclick = ()=>{
    const i = +b.dataset.up; [L[i-1],L[i]] = [L[i],L[i-1]]; rendreStops();
  });
  zone.querySelectorAll('[data-down]').forEach(b=>b.onclick = ()=>{
    const i = +b.dataset.down; [L[i+1],L[i]] = [L[i],L[i+1]]; rendreStops();
  });
  zone.querySelectorAll('[data-pin]').forEach(b=>b.onclick = ()=>{
    const i = +b.dataset.pin, a = L[i];
    ouvrirPointeur('Placer « ' + (a.nom || 'cet arrêt') + ' »', a, pos=>{
      a.lat = pos.lat; a.lng = pos.lng; rendreStops(); toast('Arrêt placé');
    });
  });
}
